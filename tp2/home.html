<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Games — Home</title>
    <link rel="stylesheet" href="css/pages/home.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/hero-carousel.css">
    <link rel="stylesheet" href="css/components/cart.css">
    <link rel="stylesheet" href="css/components/fatfooter.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/base/base.css">

</head>
<body>
    <!-- Pantalla inicial de carga: el progreso se anima desde home.js durante cinco segundos. -->
    <div class="home-loader" id="homeLoader" role="status" aria-live="polite" aria-label="Loading Nexus Games">
        <div class="home-loader__content">
            <div class="home-loader__brand">
                <img class="home-loader__logo" src="assets/img/LogoNexus.png" alt="">
                <span class="home-loader__name"><span>Nexus</span><span>Games</span></span>
            </div>
            <p class="home-loader__message">Loading your next adventure...</p>
            <div class="home-loader__progress" id="homeLoaderProgress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="home-loader__fill" id="homeLoaderFill"></span>
            </div>
            <span class="home-loader__percent" id="homeLoaderPercent">0%</span>
        </div>
    </div>

    <!-- ===== Estructura principal y carruseles ===== -->
    <div id="site-header"></div>
    <main>
        <div id="hero-carousel"></div>
        <div id="carousels"></div>
        <!-- ===== Carrito desplegable: cart.js comparte y actualiza su contenido. ===== -->
        <section class="shopping-cart" id="shopping-cart" aria-labelledby="shopping-cart-title" aria-hidden="true" hidden>
            <div class="shopping-cart__heading">
                <h2 id="shopping-cart-title">Your Cart</h2>
                <span class="shopping-cart__count" id="cart-count" aria-live="polite">0 items</span>
            </div>
            <div class="shopping-cart__divider" aria-hidden="true"></div>
            <p class="shopping-cart__empty" id="cart-empty">Your cart is empty.</p>
            <ul class="shopping-cart__items" id="cart-items" aria-label="Games in your cart"></ul>
            <div class="shopping-cart__summary" id="cart-summary" hidden>
                <div class="shopping-cart__total">
                    <span>Total</span>
                    <strong id="cart-total">USD 0</strong>
                </div>
                <button class="badge badge--free shopping-cart__buy" id="cart-buy" type="button">Buy</button>
            </div>
        </section>
    </main>
    
    <!-- ===== Pie de página y scripts de Home ===== -->
    <div id="site-footer"></div>
    <script src="js/components/layout.js"></script>
    <script src="js/components/cart.js"></script>
    <script src="js/data/recommendation.js"></script>
    <script src="js/data/api.js"></script>
    <script src="js/data/categories.js"></script>
    <script src="js/components/cards.js"></script>
    <script src="js/components/carousel.js"></script>
    <script src="js/components/hero-carousel.js"></script>
    <script src="js/pages/home.js"></script>
</body>
</html>
