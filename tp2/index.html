<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Games — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-brand" id="authBrand">
            <div class="logo-icon">
                <img src="assets/img/LogoNexus.png" alt="Nexus Games Logo" width="48" height="48">
            </div>
            <div class="wordmark"><span class="nexus">Nexus</span><span class="games">Games</span></div>
        </div>

        <!-- LOGIN -->
        <form id="loginForm">
            <h1>Sign in</h1>

            <div class="field">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required placeholder="Placeholder">
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <input type="password" id="loginPassword" required placeholder="Placeholder">
                    <button type="button" class="toggle-password" id="togglePwd" data-target="loginPassword" aria-label="Show password" aria-controls="loginPassword" aria-pressed="false">
                        <svg class="eye-icon eye-icon--open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-icon eye-icon--closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-signin">Sign in</button>

            <p class="switch-text">Is this your first time here?</p>
            <button type="button" class="btn-create" id="showRegister">Create account</button>

            <div class="divider">or</div>

            <div class="social-stack">
                <button type="button" class="btn-social btn-facebook">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
                    Continue with Facebook
                </button>
                <button type="button" class="btn-social btn-google">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.4-.2-2H12v3.9h6c-.1.9-.7 2.4-2 3.3l3.2 2.5c1.9-1.8 3-4.4 3-7.7z"/><path fill="#34A853" d="M12 23c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6C4.7 20.6 8.1 23 12 23z"/><path fill="#FBBC05" d="M6.4 15c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V8.4H3.1C2.4 9.8 2 11.4 2 13s.4 3.2 1.1 4.6L6.4 15z"/><path fill="#EA4335" d="M12 5.4c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 2.4 14.7 1.5 12 1.5 8.1 1.5 4.7 3.9 3.1 7.4l3.3 2.6C7.2 7.1 9.4 5.4 12 5.4z"/></svg>
                    Continue with Google
                </button>
                <button type="button" class="btn-social btn-apple">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 1c.1 1.1-.3 2.1-.9 2.9-.7.8-1.7 1.5-2.8 1.4-.1-1.1.4-2.2 1-2.9.7-.8 1.9-1.4 2.7-1.4zm4.2 16.2c-.3.7-.6 1.3-1 1.9-.6.9-1.2 1.9-2.2 1.9-1 0-1.3-.6-2.4-.6-1.1 0-1.5.6-2.4.6-1 0-1.7-.9-2.3-1.8-1.3-1.9-2.3-5.4-1-7.7.6-1.1 1.7-1.9 2.9-1.9 1 0 1.6.6 2.4.6.8 0 1.3-.6 2.4-.6 1 0 2.1.6 2.9 1.6-2.6 1.4-2.2 5.1.7 6z"/></svg>
                    Continue with Apple
                </button>
            </div>
        </form>

        <!-- REGISTER -->
        <form id="registerForm">
            <button type="button" id="showLogin" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Back
            </button>
            <h1>Add your data</h1>

            <div class="field">
                <label for="regEmail">Email <span class="required">*</span><span class="valid-check" id="emailCheck">✓</span></label>
                <input type="email" id="regEmail" required placeholder="Placeholder">
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="firstName">First name <span class="required">*</span><span class="valid-check" id="firstNameCheck">✓</span></label>
                    <input type="text" id="firstName" required placeholder="Placeholder">
                </div>
                <div class="field">
                    <label for="lastName">Last name <span class="required">*</span><span class="valid-check" id="lastNameCheck">✓</span></label>
                    <input type="text" id="lastName" required placeholder="Placeholder">
                </div>
            </div>

            <div class="field">
                <label for="regPassword">Password <span class="required">*</span><span class="valid-check" id="passwordCheck">✓</span></label>
                <div class="input-wrap">
                    <input type="password" id="regPassword" required placeholder="Placeholder">
                    <button type="button" class="toggle-password" id="toggleRegPwd" data-target="regPassword" aria-label="Show password" aria-controls="regPassword" aria-pressed="false">
                        <svg class="eye-icon eye-icon--open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-icon eye-icon--closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"/></svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm password <span class="required">*</span><span class="valid-check" id="confirmCheck">✓</span></label>
                <div class="input-wrap">
                    <input type="password" id="confirmPassword" required placeholder="Placeholder">
                    <button type="button" class="toggle-password" id="toggleConfirmPwd" data-target="confirmPassword" aria-label="Show password" aria-controls="confirmPassword" aria-pressed="false">
                        <svg class="eye-icon eye-icon--open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-icon eye-icon--closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"/></svg>
                    </button>
                </div>
                <span class="field-error" id="passwordError">Passwords do not match.</span>
            </div>

            <div class="field">
                <label for="nickname">Nickname (optional)</label>
                <input type="text" id="nickname" placeholder="Placeholder">
            </div>

            <div class="field">
                <label for="dobYear">Date of birth <span class="required">*</span><span class="valid-check" id="dobCheck">✓</span></label>
                <div class="dob-row">
                    <select id="dobYear" required></select>
                    <select id="dobMonth" required></select>
                    <select id="dobDay" required></select>
                </div>
            </div>

            <div class="captcha-wrap">
                <label class="captcha" for="captchaCheck">
                    <input type="checkbox" id="captchaCheck" required>
                    <span class="captcha-box" aria-hidden="true"></span>
                    <span class="captcha-label">I'm not a robot</span>
                    <span class="captcha-brand" aria-hidden="true">
                        <svg viewBox="0 0 32 32" class="captcha-logo"><path fill="#4285f4" d="M16 3a13 13 0 0 1 11.2 6.4l-5 2.8A7.2 7.2 0 0 0 16 8.6V3Z"/><path fill="#34a853" d="M27.2 9.4A13 13 0 0 1 16 29v-5.6a7.4 7.4 0 0 0 6.2-11.2l5-2.8Z"/><path fill="#fbbc05" d="M16 29A13 13 0 0 1 4.8 9.4l5 2.8A7.4 7.4 0 0 0 16 23.4V29Z"/><path fill="#ea4335" d="M4.8 9.4A13 13 0 0 1 16 3v5.6a7.4 7.4 0 0 0-6.2 3.6l-5-2.8Z"/><path fill="#fff" d="m13.3 16 1.8 1.8 4-4 1.4 1.4-5.4 5.4-3.2-3.2 1.4-1.4Z"/></svg>
                        <span>reCAPTCHA</span>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn-create">Register</button>

            <!-- Reutiliza las mismas opciones de acceso social disponibles en el login. -->
            <div class="divider">or</div>

            <div class="social-stack">
                <button type="button" class="btn-social btn-facebook">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
                    Continue with Facebook
                </button>
                <button type="button" class="btn-social btn-google">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.4-.2-2H12v3.9h6c-.1.9-.7 2.4-2 3.3l3.2 2.5c1.9-1.8 3-4.4 3-7.7z"/><path fill="#34A853" d="M12 23c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6C4.7 20.6 8.1 23 12 23z"/><path fill="#FBBC05" d="M6.4 15c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V8.4H3.1C2.4 9.8 2 11.4 2 13s.4 3.2 1.1 4.6L6.4 15z"/><path fill="#EA4335" d="M12 5.4c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 2.4 14.7 1.5 12 1.5 8.1 1.5 4.7 3.9 3.1 7.4l3.3 2.6C7.2 7.1 9.4 5.4 12 5.4z"/></svg>
                    Continue with Google
                </button>
                <button type="button" class="btn-social btn-apple">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 1c.1 1.1-.3 2.1-.9 2.9-.7.8-1.7 1.5-2.8 1.4-.1-1.1.4-2.2 1-2.9.7-.8 1.9-1.4 2.7-1.4zm4.2 16.2c-.3.7-.6 1.3-1 1.9-.6.9-1.2 1.9-2.2 1.9-1 0-1.3-.6-2.4-.6-1.1 0-1.5.6-2.4.6-1 0-1.7-.9-2.3-1.8-1.3-1.9-2.3-5.4-1-7.7.6-1.1 1.7-1.9 2.9-1.9 1 0 1.6.6 2.4.6.8 0 1.3-.6 2.4-.6 1 0 2.1.6 2.9 1.6-2.6 1.4-2.2 5.1.7 6z"/></svg>
                    Continue with Apple
                </button>
            </div>
        </form>

    </div>
</div>

<div class="success-overlay" id="successOverlay">
    <div class="success-box">
        <div class="checkmark-circle">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                <path d="M5 13l4 4L19 7" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <p id="successTitle" style="font-weight:700; font-size:16px;">Account created!</p>
        <p id="successMessage" style="color: var(--color-text-secondary); font-size:13px; margin-top:4px;">Taking you to Home...</p>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
