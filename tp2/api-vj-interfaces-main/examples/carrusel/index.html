<body>
    <h1>Carrusel de juegos</h1>

    <!-- Navegacion: son links comunes a los id de las tarjetas.

        <a href="#juego-1">&lsaquo;</a>
        <a href="#juego-1">1</a>
        <a href="#juego-5">2</a>
